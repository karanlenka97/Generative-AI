[project]
name = "generative-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Lenka", email = "karanlenka97@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain[huggingface]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.4",
    "langchain-openai>=1.7.2",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "transformers>=5.20.1",
    "torch>=2.14.1",
    "streamlit>=1.66.0",
]

[project.scripts]
generative-ai = "generative_ai:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
